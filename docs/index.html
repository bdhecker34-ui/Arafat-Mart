    <script>
      (function() {
        if (location.hostname.endsWith('github.io')) {
          var p = location.pathname;
          if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
            location.replace(location.protocol + '//' + location.host + p + '/' + location.search + location.hash);
            return;
          }
          // If accessing github.io repository root where uncompiled main.tsx is served,
          // automatically redirect to /docs/ where the compiled production build lives.
          if (!p.includes('/docs/')) {
            var script = document.querySelector('script[src*="main.tsx"]');
            if (script) {
              location.replace(p + 'docs/' + location.search + location.hash);
            }
          }
        }
      })();
    </script>
